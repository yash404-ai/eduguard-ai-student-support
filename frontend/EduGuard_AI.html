<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduGuard AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--bg2:#0d1330;--tx:#e8ecff;--mu:#9aa6d6;--cy:#22e4ff;--vi:#8b5cf6;--mg:#ff3ea5;--ok:#3ef0a0;--wa:#ffc857;--glass:rgba(20,28,66,.55);--bd:rgba(130,150,255,.22);--hd:'Sora',system-ui,sans-serif;--bo:'IBM Plex Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-x]){}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--bo);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.28),transparent),radial-gradient(700px 500px at -10% 30%,rgba(34,228,255,.14),transparent)}
body.adm{--cy:#ff3ea5;--vi:#ff8a3d;background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,62,165,.25),transparent),radial-gradient(700px 500px at -10% 30%,rgba(139,92,246,.18),transparent)}
h1,h2,h3{font-family:var(--hd);line-height:1.1;margin:0 0 .5em;letter-spacing:-.02em}h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:800}h2{font-size:clamp(1.5rem,3vw,2.1rem)}h3{font-size:1.1rem}
a{color:var(--cy)}p{margin:.4em 0 1em;max-width:68ch}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);padding:22px}
.btn{font:600 .95rem var(--hd);color:var(--tx);cursor:pointer;padding:11px 20px;border-radius:12px;border:1px solid var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:box-shadow .2s,transform .2s,border-color .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--cy);box-shadow:0 0 22px color-mix(in srgb,var(--cy) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--cy) 45%,transparent),color-mix(in srgb,var(--vi) 55%,transparent));border-color:var(--cy)}
.btn.dg{border-color:var(--mg)}.btn.dg:hover{box-shadow:0 0 22px rgba(255,62,165,.6)}.btn.sm{padding:6px 12px;font-size:.82rem}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:rgba(5,8,24,.6);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
label{display:block;font-weight:500;margin:12px 0 4px;font-size:.92rem}.err{color:#ff8fb8;font-size:.85rem;min-height:1.2em}
nav.top{position:sticky;top:0;z-index:20;background:rgba(7,11,26,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
nav.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{font:800 1.2rem var(--hd);text-decoration:none;color:var(--tx);white-space:nowrap}.logo b{color:var(--cy);text-shadow:0 0 14px var(--cy)}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.links a{color:var(--mu);text-decoration:none;padding:8px 11px;border-radius:9px;font-size:.9rem;white-space:nowrap;position:relative}
.links a:hover,.links a.on{color:var(--tx);background:rgba(130,150,255,.14)}.links a.on{box-shadow:inset 0 -2px var(--cy)}
.dot{background:var(--mg);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 6px;margin-left:5px}
.burger{display:none}
@media(max-width:900px){.burger{display:inline-flex;margin-left:auto}.links{display:none;position:absolute;top:62px;left:0;right:0;flex-direction:column;background:rgba(7,11,26,.97);padding:10px 20px 18px;border-bottom:1px solid var(--bd)}.links.open{display:flex}}
.crumb{color:var(--mu);font-size:.88rem;padding:18px 0 4px}.crumb a{color:var(--mu)}
.grid{display:grid;gap:18px}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat{font:800 2.6rem var(--hd);background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 12px var(--cy);transition:width .8s}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--bd)}
.s-Open{color:var(--cy);border-color:var(--cy)}.s-In-Progress{color:var(--wa);border-color:var(--wa)}.s-Awaiting-User{color:var(--vi);border-color:var(--vi)}.s-Resolved{color:var(--ok);border-color:var(--ok)}.s-Closed{color:var(--mu)}
.p-Urgent{color:var(--mg);border-color:var(--mg)}.p-High{color:var(--wa)}
.hero{position:relative;padding:70px 0 0;overflow:hidden}.hero .sky{display:block;width:100%;height:auto;margin-top:30px;max-height:300px}
.warn{border-left:3px solid var(--wa);padding:10px 14px;background:rgba(255,200,87,.08);border-radius:0 10px 10px 0;font-size:.9rem;margin:14px 0}
.msg{padding:12px 14px;border-radius:12px;margin:10px 0;border:1px solid var(--bd);background:rgba(255,255,255,.04)}.msg.me{border-color:var(--cy)}.msg.auto{border-style:dashed;border-color:var(--vi)}.msg.int{border-color:var(--wa);background:rgba(255,200,87,.07)}
.msg small{color:var(--mu)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:.92rem}
.row{cursor:pointer}.row:hover{background:rgba(130,150,255,.1)}.row .u{width:8px;height:8px;border-radius:50%;background:var(--mg);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--mg)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sk{height:90px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.12),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.1s infinite;margin-bottom:14px}@keyframes sh{to{background-position:-200% 0}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:grid;gap:8px}.toast{padding:12px 16px;border-radius:12px;background:rgba(13,19,48,.95);border:1px solid var(--cy);box-shadow:0 0 20px rgba(34,228,255,.3);max-width:320px}.toast.bad{border-color:var(--mg)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(3,5,15,.7);display:grid;place-items:center;padding:20px}.modal .glass{max-width:420px;background:rgba(13,19,48,.92)}
.welcome{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;text-align:center;animation:fo .5s 1.7s forwards}.welcome h1{text-shadow:0 0 30px var(--cy),0 0 60px var(--vi);animation:gl 1.6s ease-in-out}@keyframes fo{to{opacity:0;visibility:hidden}}@keyframes gl{from{opacity:0;transform:scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.win{animation:fl 3s infinite steps(2)}@keyframes fl{50%{opacity:.25}}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs .btn.on{border-color:var(--cy);box-shadow:0 0 16px var(--cy)}
.auth{max-width:440px;margin:40px auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const MV='rf-uci-v1',FL=['Age at enrollment','Admission grade','1st semester units approved','2nd semester units approved','Tuition fees up to date'],CC={Dropout:'var(--mg)',Enrolled:'var(--wa)',Graduate:'var(--ok)'};
function rfProba(x){const n=MODEL.classes.length,a=new Array(n).fill(0);for(const t of MODEL.trees){let i=0;while(t[i].length===4){const d=t[i];i=x[d[0]]<=d[1]?d[2]:d[3]}for(let k=0;k<n;k++)a[k]+=t[i][k]}return a.map(v=>v/MODEL.trees.length)}
function explain(x){const di=MODEL.classes.indexOf('Dropout'),base=rfProba(x)[di];return x.map((_,i)=>{const y=x.slice();y[i]=i===4?1:MODEL.median[i];return{n:FL[i],d:base-rfProba(y)[di]}}).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))}
const pc=p=>Math.round(p*100);
function modelCard(){const M=MODEL.metrics;return `<h3>About this model</h3><p>Random Forest (${MODEL.trees.length} trees) named <code>${MV}</code>, trained in your browser-ready form from the UCI dropout dataset: ${M.n_total.toLocaleString()} students (${MODEL.classes.map(c=>c+' '+M.counts[c].toLocaleString()).join(', ')}). It was fitted on a stratified ${M.n_train.toLocaleString()} student training split and scored on ${M.n_test} held-out students.</p><div class="flex"><span class="pill s-Open">Accuracy ${pc(M.accuracy)}%</span><span class="pill s-Open">Macro-F1 ${M.macro_f1.toFixed(2)}</span></div><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Class</th><th>Precision</th><th>Recall</th><th>F1</th></tr>${MODEL.classes.map(c=>{const q=M.per_class[c];return `<tr><td>${c}</td><td>${q.precision.toFixed(2)}</td><td>${q.recall.toFixed(2)}</td><td>${q['f1-score'].toFixed(2)}</td></tr>`}).join('')}</table></div><p style="font-size:.88rem;color:var(--mu)">The Enrolled class (students still enrolled past the normal duration) is the hardest to predict. Treat it with extra caution.</p>`}
const V={};
V.home=()=>`<section class="hero"><div class="wrap"><div class="pill s-Open">Decision support, not decisions</div><h1 style="margin-top:14px">Spot dropout risk early.<br>Step in with support.</h1><p style="font-size:1.15rem;color:var(--mu)">EduGuard AI helps school teams notice students who may need help and open a support request before they fall behind.</p><div class="flex"><a class="btn pri" href="#${S.user?'dashboard':'auth'}">${S.user?'Open dashboard':'Sign in'}</a><a class="btn" href="#community">Browse help articles</a></div></div>${sky()}</section>
<div class="wrap" style="padding-top:40px"><div class="grid g3"><div class="glass"><h3>Methodology</h3><p>Logistic Regression, Random Forest and Gradient Boosting were compared on the same held-out split. A compact Random Forest is used here because it runs fully in your browser. We report class-wise precision, recall, F1 and macro-F1, not accuracy alone.</p></div><div class="glass"><h3>Data provenance</h3><p>The UCI dropout dataset describes Portuguese higher education. UDISE+ holds school-level aggregates. Neither is validated for individual Indian schoolchildren.</p></div><div class="glass"><h3>Responsible AI</h3><p>Predictions never trigger punishment, exclusion or denial of services. A person reviews every result, and we collect as little student data as possible.</p></div></div></div>`;
V.auth=()=>{const a=role==='admin';return `<div class="wrap"><div class="glass auth"><div class="tabs"><button class="btn ${!a?'on':''}" data-a="role" data-v="citizen">Student support</button><button class="btn ${a?'on':''}" data-a="role" data-v="admin">Administrator</button></div><h2>${a?'Administrator sign in':mode==='up'?'Create your account':'Welcome back'}</h2>${a?'<div class="warn">Admin accounts are created by invitation or a server command. There is no public admin registration.</div>':''}<form id="af" novalidate>${mode==='up'&&!a?'<label for="nm">Display name</label><input id="nm" autocomplete="name">':''}<label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="ae" role="alert"></div><div class="flex" style="margin-top:8px"><button class="btn pri" type="submit">${mode==='up'&&!a?'Create account':'Sign in'}</button>${a?'':'<button type="button" class="btn" data-a="google">Continue with Google</button>'}</div></form><p style="margin-top:16px;font-size:.9rem">${a?'':`<a href="#" data-a="mode">${mode==='up'?'I already have an account':'Create an account'}</a> · `}<a href="#" data-a="forgot">Forgot password?</a></p><div class="warn">Preview build: sign-in runs in this browser only. Real sessions, Argon2id hashing and role checks run on the FastAPI server, which is not connected here.</div></div></div>`};
function guard(r){if(!S.user&&!['home','auth','community'].includes(r)){location.hash='auth';return false}if(r==='admin'&&(!S.user||S.user.role!=='admin')){toast('Administrator access required.',1);location.hash=S.user?'dashboard':'auth';return false}return true}
const mine=()=>S.tickets.filter(t=>S.user.role==='admin'||t.owner===S.user.email);
V.dashboard=()=>{const T=mine(),c=s=>T.filter(t=>t.status===s).length,rec=S.audit.filter(a=>a.by===S.user.name).slice(0,5);return `<div class="wrap">${crumb('dashboard')}<h1 style="font-size:2.4rem">Hi, ${esc(S.user.name)}</h1><div class="grid g3"><div class="glass"><div class="stat" data-n="${T.length}">0</div>Tickets submitted</div><div class="glass"><div class="stat" data-n="${S.notifs.filter(n=>!n.read).length}">0</div>Unread notifications</div><div class="glass"><div class="stat" data-n="${c('Resolved')+c('Closed')}">0</div>Resolved or closed</div></div><div class="grid g2" style="margin-top:18px"><div class="glass"><h3>Ticket status</h3>${ST.map(s=>`<div style="margin:10px 0"><div class="flex" style="justify-content:space-between"><span>${s}</span><span>${c(s)}</span></div><div class="bar"><i style="width:${T.length?c(s)/T.length*100:0}%"></i></div></div>`).join('')}</div><div class="glass"><h3>Quick actions</h3><div class="flex"><a class="btn pri" href="#tickets" data-a="newt">New support request</a><a class="btn" href="#predict">Prediction tool</a><a class="btn" href="#tickets">Review replies</a><a class="btn" href="#community">Resources</a></div><h3 style="margin-top:22px">Recent activity</h3>${rec.length?rec.map(a=>`<div class="msg"><small>${fd(a.at)}</small><br>${esc(a.a)}</div>`).join(''):'<p style="color:var(--mu)">Nothing yet. Submit a support request to get started.</p>'}</div></div></div>`};
V.tickets=()=>{if(F.sel){const t=S.tickets.find(x=>x.ref===F.sel);if(t)return `<div class="wrap">${crumb('tickets')}${detail(t,false)}</div>`;F.sel=null}
return `<div class="wrap">${crumb('tickets')}<div class="flex" style="justify-content:space-between"><h1 style="font-size:2.4rem">Your tickets</h1><button class="btn pri" data-a="newt">New request</button></div><div id="tf" style="display:none" class="glass">${tform()}</div><div class="flex" style="margin:16px 0">${filters()}</div><div id="tl">${list(false)}</div></div>`};
const tform=()=>`<h3>New support request</h3><form id="tfm" novalidate><label for="tc">Category</label><select id="tc">${CAT.map(c=>`<option>${c}</option>`).join('')}</select><label for="ts">Subject</label><input id="ts" maxlength="120"><label for="td">What do you need help with?</label><textarea id="td" rows="5" maxlength="2000"></textarea><div class="warn">Do not include a student’s full profile, health details or ID numbers here.</div><label for="tfile">Attachment (optional, PNG, JPG or PDF, up to 2 MB)</label><input id="tfile" type="file" accept=".png,.jpg,.jpeg,.pdf"><div class="err" id="te" role="alert"></div><button class="btn pri" type="submit">Submit request</button></form>`;
const filters=()=>`<input style="max-width:260px" placeholder="Search tickets" aria-label="Search" data-c="q" value="${esc(F.q)}"><select style="max-width:180px" aria-label="Status" data-c="st"><option value="">All statuses</option>${ST.map(s=>`<option ${F.st===s?'selected':''}>${s}</option>`).join('')}</select><select style="max-width:180px" aria-label="Sort" data-c="sort"><option value="new" ${F.sort==='new'?'selected':''}>Newest first</option><option value="old" ${F.sort==='old'?'selected':''}>Oldest first</option><option value="pr" ${F.sort==='pr'?'selected':''}>Highest priority</option></select>`;
function list(adm){let T=mine().filter(t=>(!F.st||t.status===F.st)&&(!F.q||(t.subject+t.ref+t.cat).toLowerCase().includes(F.q.toLowerCase())));T.sort((a,b)=>F.sort==='old'?a.at.localeCompare(b.at):F.sort==='pr'?PR.indexOf(b.pri)-PR.indexOf(a.pri):b.at.localeCompare(a.at));const pages=Math.max(1,Math.ceil(T.length/5));F.pg=Math.min(F.pg,pages);const P=T.slice((F.pg-1)*5,F.pg*5);
if(!T.length)return `<div class="glass"><h3>${mine().length?'No tickets match':'No tickets yet'}</h3><p>${mine().length?'Clear the search or filters to see everything.':'Submit your first support request and a person will reply here.'}</p></div>`;
return `<div class="glass" style="overflow-x:auto"><table><tr><th>Ref</th><th>Subject</th><th>Status</th><th>Priority</th><th>Updated</th></tr>${P.map(t=>`<tr class="row" tabindex="0" data-a="open" data-v="${t.ref}"><td>${t.unread?'<span class="u" title="Unread"></span>':''}${t.ref}</td><td>${esc(t.subject)}</td><td><span class="pill s-${cls(t.status)}">${t.status}</span></td><td><span class="pill p-${t.pri}">${t.pri}</span></td><td>${fd(t.upd)}</td></tr>`).join('')}</table><div class="flex" style="justify-content:space-between;margin-top:12px"><span>Page ${F.pg} of ${pages}</span><span class="flex"><button class="btn sm" data-a="pg" data-v="-1" ${F.pg<2?'disabled':''}>Previous</button><button class="btn sm" data-a="pg" data-v="1" ${F.pg>=pages?'disabled':''}>Next</button></span></div></div>`}
function detail(t,adm){const ms=t.msgs.filter(m=>adm||!m.int);return `<button class="btn sm" data-a="close">Back to list</button><h2 style="margin-top:14px">${esc(t.subject)}</h2><div class="flex"><span class="pill">${t.ref}</span><span class="pill s-${cls(t.status)}">${t.status}</span><span class="pill p-${t.pri}">${t.pri}</span><span class="pill">${esc(t.cat)}</span>${t.att?`<span class="pill">Attachment: ${esc(t.att)}</span>`:''}</div><div class="grid g2" style="margin-top:16px"><div>${ms.map(m=>`<div class="msg ${m.from==='auto'?'auto':m.int?'int':m.from==='user'?'me':''}"><small>${m.from==='auto'?'Automated message':m.int?'Internal note, staff only':m.from==='admin'?'Support team':esc(t.ownerName)} · ${fd(m.at)}</small><br>${esc(m.text)}</div>`).join('')}${t.status==='Closed'?'<p style="color:var(--mu)">This ticket is closed.</p>':`<form id="rf"><label for="rt">${adm?'Reply to citizen':'Add a reply'}</label><textarea id="rt" rows="3" maxlength="2000"></textarea><div class="err" id="re" role="alert"></div><div class="flex"><button class="btn pri" type="submit">Send reply</button>${adm?'<button class="btn" type="button" data-a="inote">Save internal note</button>':''}</div></form>`}</div><div class="glass"><h3>Status history</h3>${t.hist.map(h=>`<div style="margin:8px 0"><small>${fd(h.at)}</small><br>${esc(h.txt)}</div>`).join('')}${adm?`<h3 style="margin-top:20px">Manage</h3><label for="ms">Status</label><select id="ms" data-c="tst">${ST.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select><label for="mp">Priority</label><select id="mp" data-c="tpr">${PR.map(s=>`<option ${t.pri===s?'selected':''}>${s}</option>`).join('')}</select><div class="flex" style="margin-top:12px"><button class="btn sm" data-a="assign">${t.asg?'Unassign':'Assign to me'}</button><button class="btn sm dg" data-a="${['Resolved','Closed'].includes(t.status)?'reopen':'resolve'}">${['Resolved','Closed'].includes(t.status)?'Reopen':'Resolve'}</button></div>`:''}</div></div>`}
V.admin=()=>{if(F.sel){const t=S.tickets.find(x=>x.ref===F.sel);if(t)return `<div class="wrap">${crumb('admin')}${detail(t,true)}</div>`;F.sel=null}const T=S.tickets,o=T.filter(t=>t.status==='Open').length;return `<div class="wrap">${crumb('admin')}<h1 style="font-size:2.4rem">Admin Control Panel</h1><div class="grid g3"><div class="glass"><div class="stat" data-n="${T.length}">0</div>Tickets in queue</div><div class="glass"><div class="stat" data-n="${o}">0</div>Open, awaiting triage</div><div class="glass"><div class="stat" data-n="${T.filter(t=>t.pri==='Urgent').length}">0</div>Urgent</div></div><h2 style="margin-top:28px">Ticket queue</h2><div class="flex" style="margin:12px 0">${filters()}</div><div id="tl">${list(true)}</div><div class="grid g2" style="margin-top:22px"><div class="glass"><h3>Audit log</h3>${S.audit.length?S.audit.slice(0,8).map(a=>`<div class="msg"><small>${fd(a.at)} · ${esc(a.by)}</small><br>${esc(a.a)}</div>`).join(''):'<p style="color:var(--mu)">Admin actions will be recorded here.</p>'}</div><div class="glass">${modelCard()}<div class="warn">API and database are not connected in this preview. The model above is embedded in this page and its figures come from the held-out test split.</div></div></div></div>`};
V.predict=()=>`<div class="wrap">${crumb('predict')}<h1 style="font-size:2.4rem">Prediction (research demo)</h1><div class="warn">Trained on UCI data from Portuguese higher education. This is not a validated risk assessment for Indian schoolchildren. Use it only to start a supportive human conversation, never to punish or exclude.</div><div class="grid g2"><form class="glass" id="pf" novalidate><label for="p1">Age at enrollment (16 to 70)</label><input id="p1" type="number"><label for="p2">Admission grade (0 to 200)</label><input id="p2" type="number" step="0.1"><label for="p3">1st semester units approved (0 to 30)</label><input id="p3" type="number"><label for="p4">2nd semester units approved (0 to 30)</label><input id="p4" type="number"><label for="p5">Tuition fees up to date</label><select id="p5"><option value="">Select</option><option>Yes</option><option>No</option></select><div class="err" id="pe" role="alert"></div><button class="btn pri" type="submit">Run prediction</button></form><div class="glass" id="pr"><h3>Result</h3><p style="color:var(--mu)">Enter values to see the predicted class, probability, model version and explanation.</p></div></div><div class="glass" style="margin-top:18px">${modelCard()}</div></div>`;
V.community=()=>`<div class="wrap">${crumb('community')}<h1 style="font-size:2.4rem">Community and help</h1><div class="flex" style="margin-bottom:16px"><input style="max-width:300px" placeholder="Search articles" aria-label="Search articles" data-c="aq"><select style="max-width:220px" aria-label="Category" data-c="ac"><option value="">All categories</option>${[...new Set(ARTS.map(a=>a[0]))].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="al">${arts('','')}</div><div class="warn">Approved articles only. Private tickets and risk predictions never appear here.</div></div>`;
const arts=(q,c)=>{const A=ARTS.filter(a=>(!c||a[0]===c)&&(!q||(a[1]+a[2]).toLowerCase().includes(q.toLowerCase())));return A.length?`<div class="grid g2">${A.map(a=>`<details class="glass"><summary><b>${a[1]}</b><br><small style="color:var(--mu)">${a[0]}</small></summary><p>${a[2]}</p></details>`).join('')}</div>`:'<div class="glass"><h3>No articles found</h3><p>Try a different word, or open a support request and a person will help.</p></div>'};
V.support=()=>`<div class="wrap">${crumb('support')}<h1 style="font-size:2.4rem">Get support</h1><div class="grid g3"><div class="glass"><h3>Talk to a person</h3><p>Open a private ticket. Replies appear in your Tickets page.</p><a class="btn pri" href="#tickets" data-a="newt">New support request</a></div><div class="glass"><h3>Read guidance</h3><p>Attendance, tutoring, financial aid and referrals.</p><a class="btn" href="#community">Open help articles</a></div><div class="glass"><h3>Your privacy</h3><p>Data is kept only as long as needed for your request. You can delete your local data from Profile.</p><a class="btn" href="#profile">Open profile</a></div></div></div>`;
V.notifications=()=>`<div class="wrap">${crumb('notifications')}<div class="flex" style="justify-content:space-between"><h1 style="font-size:2.4rem">Notifications</h1><button class="btn" data-a="readall">Mark all read</button></div>${S.notifs.length?S.notifs.map(n=>`<div class="msg ${n.read?'':'me'}"><small>${fd(n.at)}</small><br>${esc(n.txt)}</div>`).join(''):'<div class="glass"><h3>All caught up</h3><p>You will see replies and status changes here.</p></div>'}</div>`;
V.profile=()=>`<div class="wrap">${crumb('profile')}<h1 style="font-size:2.4rem">Profile</h1><div class="glass" style="max-width:520px"><form id="prf"><label for="dn">Display name</label><input id="dn" value="${esc(S.user.name)}" maxlength="60"><label>Email</label><input value="${esc(S.user.email)}" disabled><label>Role</label><input value="${esc(S.user.role)}" disabled><div class="flex" style="margin-top:14px"><button class="btn pri" type="submit">Save changes</button><button type="button" class="btn dg" data-a="wipe">Delete local data</button></div></form></div></div>`;
function render(){const r=route();document.body.classList.toggle('adm',role==='admin'&&r==='auth'||!!S.user&&S.user.role==='admin');if(!guard(r))return;const v=V[r]||V.home;$('#app').innerHTML=nav(r)+'<main id="m"><div class="wrap"><div class="sk"></div><div class="sk"></div></div></main>';setTimeout(()=>{if(route()!==r)return;$('#m').innerHTML=v();document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n;let i=0;const t=setInterval(()=>{i=Math.min(n,i+Math.ceil(n/20||1));e.textContent=i;if(i>=n)clearInterval(t)},30)});window.scrollTo(0,0)},230)}
addEventListener('hashchange',()=>{menu=false;F.sel=null;render()});

document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const t=S.tickets.find(x=>x.ref===F.sel);
if(c==='st'||c==='sort'){F[c]=e.target.value;F.pg=1;relist()}
if(c==='ac'||c==='aq'){$('#al').innerHTML=arts(document.querySelector('[data-c=aq]').value,document.querySelector('[data-c=ac]').value)}
if(c==='tst'&&t){const v=e.target.value;const go=()=>{setStatus(t,v);render()};['Closed'].includes(v)?confirmD('Close this ticket? The citizen can no longer reply.',go):go()}
if(c==='tpr'&&t){t.pri=e.target.value;t.hist.push({at:now(),txt:'Priority set to '+t.pri});log(`Priority of ${t.ref} set to ${t.pri}`);save();toast('Priority updated.');render()}});

function setStatus(t,s){t.status=s;t.upd=now();t.hist.push({at:now(),txt:'Status changed to '+s+(S.user.role==='admin'?' by support team':'')});if(S.user.role==='admin'){log(`${t.ref} status set to ${s}`);note(t.ref,`Ticket ${t.ref} is now ${s}.`)}save();toast('Status updated.')}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,t=S.tickets.find(x=>x.ref===F.sel);if(!['newt'].includes(a)||b.tagName==='BUTTON')e.preventDefault();
if(a==='menu'){menu=!menu;render()}
if(a==='role'){role=v;render()}if(a==='mode'){mode=mode==='in'?'up':'in';render()}
if(a==='google')toast('Google sign-in needs OAuth credentials on the backend. Not configured in this preview.',1);

if(a==='logout')confirmD('Sign out of EduGuard AI?',()=>{S.user=null;save();location.hash='home';render();toast('Signed out.')});
if(a==='newt'){if(route()!=='tickets'){location.hash='tickets';setTimeout(()=>{const f=$('#tf');if(f)f.style.display='block'},400)}else{F.sel=null;render();setTimeout(()=>{$('#tf').style.display='block';$('#ts').focus()},300)}}
if(a==='open'){F.sel=v;const x=S.tickets.find(q=>q.ref===v);if(x&&S.user.role!=='admin')x.unread=false;save();render()}

if(a==='readall'){S.notifs.forEach(n=>n.read=true);save();render()}
if(a==='assign'&&t){t.asg=t.asg?null:S.user.name;t.hist.push({at:now(),txt:t.asg?'Assigned to '+t.asg:'Unassigned'});log(`${t.ref} ${t.asg?'assigned':'unassigned'}`);save();toast(t.asg?'Assigned to you.':'Unassigned.');render()}

if(a==='reopen'&&t){setStatus(t,'Open');render()}
if(a==='inote'&&t){const x=$('#rt').value.trim();if(!x){$('#re').textContent='Write a note first.';return}t.msgs.push({from:'admin',int:true,text:x,at:now()});log(`Internal note on ${t.ref}`);save();toast('Internal note saved.');render()}
if(a==='wipe')confirmD('Delete all tickets, notifications and your session stored in this browser?',()=>{S={user:null,tickets:[],notifs:[],audit:[]};save();location.hash='home';render();toast('Local data deleted.')})});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
if(id==='af'){const em=$('#em').value.trim(),pw=$('#pw').value,nm=$('#nm')?$('#nm').value.trim():'',er=$('#ae');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return er.textContent='Enter a valid email address.';if(pw.length<8)return er.textContent='Password must be at least 8 characters.';if(mode==='up'&&role==='citizen'&&!nm)return er.textContent='Enter a display name.';
